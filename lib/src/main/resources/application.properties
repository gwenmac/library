spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3333/library}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JWT
library.jwt.secret=${JWT_SECRET:default-dev-secret-change-in-production-at-least-32-chars!!}
library.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}