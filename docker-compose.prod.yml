version: '3.9'

services:
  # ── MySQL ──
  mysql:
    image: mysql:8.0
    container_name: library-mysql
    command: mysqld --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: library
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./library-docker/mysql/boot.sql:/docker-entrypoint-initdb.d/1.sql
      - ./library-docker/mysql/data.sql:/docker-entrypoint-initdb.d/2.sql
      - mysql-data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Spring Boot Backend ──
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: library-backend
    environment:
      DB_URL: jdbc:mysql://mysql:3306/library
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  # ── Nginx + Vue Frontend ──
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: library-frontend
    ports:
      - "80:80"
      - "443:443"
    # Uncomment for Let's Encrypt SSL:
    # volumes:
    #   - /etc/letsencrypt:/etc/letsencrypt:ro
    #   - certbot-webroot:/var/www/certbot
    depends_on:
      - backend
    restart: unless-stopped

  # ── Certbot (uncomment for HTTPS) ──
  # certbot:
  #   image: certbot/certbot
  #   volumes:
  #     - /etc/letsencrypt:/etc/letsencrypt
  #     - certbot-webroot:/var/www/certbot
  #   entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done'"

volumes:
  mysql-data:
  # certbot-webroot:
